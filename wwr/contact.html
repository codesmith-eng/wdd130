<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us at Splash White Water Rafting</title>
    <meta name="description"
      content="Thrilling white water rafting adventures with expert guides and unforgettable">
    <meta name="author" content="Moses Olagbami Ayobami">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/splash.png" alt="Splash Water Rafting Company" width="80">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <article>
                <h1>SPLASH WHITE WATER RAFTING</h1>
                <p>8, Taiwo Bashorun Street</p>
                <p>Ikeja, Lagos, Nigeria</p>
                <p>+2347032073483</p>
                <p>info@splashwhitewaterrafting.com</p>
            </article>
        </div>

        <div>
            <section class="history">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3962.989087487037!2d3.291765082641009!3d6.64827328287212!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b90d3c48ebb5f%3A0x1bc1d1274c5dae49!2s8%20Taiwo%20Bashorun%20St%2C%20Abule%20Egba%2C%20Lagos%20102213%2C%20Lagos!5e0!3m2!1sen!2sng!4v1770565002593!5m2!1sen!2sng"
                  width="500" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>

                <form>
                    <div class="form-item column1">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-item column1">
                        <label for="fullname">Name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>

                    <div class="form-item column1">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>


                    <div class="form-item">
                        <label for="country">Choose a Country to go Water Raft with us
                        </label>
                        <select name="country" id="country" required>
                            <option value="" selected disabled>Choose one...</option>
                            <option value="">United States</option>
                            <option value="">Spain</option>
                            <option value="">United Kingdom</option>
                            <option value="">Italy</option>
                            <option value="">Norway</option>
                            <option value="">Other</option>
                        </select>
                    </div>

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <div class="form-item column2">
                            <input type="radio" id="inquiry" name="inquiry">
                            <label for="inquiry">General Inquiry</label>

                            <input type="radio" id="reservation" name="inquiry">
                            <label for="reservation">Reservation Question</label>

                            <input type="radio" id="website" name="inquiry">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </fieldset>


                    <div class="form-item column4">
                        <label for="feedback">Message</label>
                        <textarea id="feedback" name="feedback" rows="30" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="form-itemss column3">
                        <input type="checkbox" id="sub" name="sub" required>
                        <label for="sub">Please Subscribe me to the Monthly Newsletter</label>
                    </div>

                    <button type="submit">Get in Touch</button>
                </form>
            </section>
        </div>
        <section class="image">
            <h2>We Are Here to Serve You!</h2>
            <figure>
                <img src="images/rafters.jpeg" alt="Rafting in Madrid">
                <figcaption>White Water Rafting Guides</figcaption>
            </figure>

            <figure>
                <img src="images/water.jpeg" alt="Rafting in Barcelona">
                <figcaption>Rafting Crew Members</figcaption>
            </figure>

            <figure>
                <img src="images/rafting3.jpg" alt="Rafting in Utah">
                <figcaption>Outdoor Adventure Staffs</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Splash White Water Rafting | Moses Olagbami Ayobami</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="35">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="35">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter Icon" width="35">
            </a>
        </nav>
    </footer>

</body>

</html>
